name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

# Don't run two image builds for main at the same time.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    # One native runner per architecture: the apt and Playwright installs are slow and fragile under QEMU.
    uses: yama6a/gha/.github/workflows/docker-build-release-multiarch.yaml@v2
    permissions:
      contents: write # required to create the GitHub release
      packages: write # required, or the image push fails with permission_denied
      id-token: write # mints the OIDC token the provenance attestation is signed with
      attestations: write # stores the attestation

  deploy:
    needs: build-push
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v2
    permissions: {} # nothing from THIS repo is needed; DEPLOY_TOKEN carries the rights
    with:
      tag: ${{ needs.build-push.outputs.version }}
      values-path: argo_apps/workloads/charts/claudetainer/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
