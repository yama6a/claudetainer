# Required checks on main: go / go, shell, yaml, renovate-config, build-amd64, build-arm64. Renovate's automerge waits for
# these, so a bad bump never lands.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: yama6a/gha/.github/workflows/go-ci.yaml@v2

  shell:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2

  yaml:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2

  renovate-config:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2

  # Two named jobs, not a matrix: a required check cannot name one matrix shard. Each builds natively and runs
  # the smoke test, which catches a bumped version whose download URL no longer exists.
  build-amd64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/hadolint@v2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: claudetainer:ci
      - run: ./test/smoke.sh claudetainer:ci

  build-arm64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: claudetainer:ci
      - run: ./test/smoke.sh claudetainer:ci
